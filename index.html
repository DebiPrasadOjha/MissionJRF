<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mission JRF Mock Test Portal</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-purple-900 via-indigo-900 to-slate-900 min-h-screen text-white flex flex-col items-center justify-center p-4">

    <!-- Container -->
    <div class="w-full max-w-4xl bg-slate-800/80 backdrop-blur-md rounded-2xl p-6 sm:p-10 shadow-2xl border border-purple-500/20">

        <!-- Header -->
        <header class="text-center mb-8">
            <h1 class="text-3xl sm:text-4xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-purple-400 to-pink-400">
                🎯 MISSION JRF MOCK TEST
            </h1>
            <p class="text-gray-300 text-sm sm:text-base mt-2">Psychology & Paper 1 Practice Engine</p>
        </header>

        <!-- Mode Selection Screen -->
        <div id="selection-screen" class="space-y-6">
            <h2 class="text-xl font-semibold text-purple-200 text-center">Select Test Intensity:</h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                <button onclick="startTest(10, 10, false)" class="flex flex-col items-center p-5 bg-emerald-600/30 border border-emerald-500/40 hover:bg-emerald-600/50 rounded-xl transition-all transform hover:-translate-y-1">
                    <span class="text-2xl mb-1">⚡</span>
                    <span class="font-bold text-lg text-emerald-300">10 Mins</span>
                    <span class="text-xs text-gray-300 mt-1">Light Intensity</span>
                    <span class="text-xs text-emerald-200 mt-2 font-mono">10 Questions</span>
                </button>
                <button onclick="startTest(30, 20, false)" class="flex flex-col items-center p-5 bg-amber-600/30 border border-amber-500/40 hover:bg-amber-600/50 rounded-xl transition-all transform hover:-translate-y-1">
                    <span class="text-2xl mb-1">🔥</span>
                    <span class="font-bold text-lg text-amber-300">30 Mins</span>
                    <span class="text-xs text-gray-300 mt-1">Medium Intensity</span>
                    <span class="text-xs text-amber-200 mt-2 font-mono">20 Questions</span>
                </button>
                <button onclick="startTest(60, 35, false)" class="flex flex-col items-center p-5 bg-rose-600/30 border border-rose-500/40 hover:bg-rose-600/50 rounded-xl transition-all transform hover:-translate-y-1">
                    <span class="text-2xl mb-1">💣</span>
                    <span class="font-bold text-lg text-rose-300">60 Mins</span>
                    <span class="text-xs text-gray-300 mt-1">High Intensity</span>
                    <span class="text-xs text-rose-200 mt-2 font-mono">35 Questions</span>
                </button>
                <!-- NEW "ONLY PSYCHOLOGY" BUTTON -->
                <button onclick="startTest(15, 15, true)" class="flex flex-col items-center p-5 bg-fuchsia-600/30 border border-fuchsia-500/50 hover:bg-fuchsia-600/50 rounded-xl transition-all transform hover:-translate-y-1 ring-2 ring-fuchsia-400/30">
                    <span class="text-2xl mb-1">🧠</span>
                    <span class="font-bold text-lg text-fuchsia-300">Only Psychology</span>
                    <span class="text-xs text-gray-300 mt-1">Extreme Difficulty</span>
                    <span class="text-xs text-fuchsia-200 mt-2 font-mono">15 Mins • 15 Questions</span>
                </button>
            </div>
            <div class="text-center text-xs text-purple-300/60 pt-4">
                Cut-off Criteria: <span class="font-bold text-purple-300">80% or Higher</span>
            </div>
        </div>

        <!-- Quiz Screen -->
        <div id="quiz-screen" class="hidden">
            <div class="flex justify-between items-center mb-6 bg-slate-900/60 p-4 rounded-xl border border-purple-500/30">
                <div>
                    <span class="text-xs text-gray-400 block">Question</span>
                    <span id="q-counter" class="font-bold text-lg text-purple-300">1 / 10</span>
                </div>
                <div>
                    <span class="text-xs text-gray-400 block text-right">Time Remaining</span>
                    <span id="timer" class="font-mono font-bold text-xl text-pink-400">00:00</span>
                </div>
            </div>

            <div class="bg-slate-900/40 p-6 rounded-xl border border-slate-700 mb-6">
                <span id="q-category" class="text-xs font-semibold px-2.5 py-0.5 rounded bg-purple-900 text-purple-300 border border-purple-700 uppercase tracking-wider mb-3 inline-block">Topic</span>
                <p id="q-text" class="text-lg font-medium text-slate-100 mt-1">Question loading...</p>
            </div>

            <div id="options-container" class="space-y-3 mb-8"></div>

            <div class="flex justify-between items-center">
                <button id="prev-btn" onclick="navigate(-1)" class="px-5 py-2.5 bg-slate-700 hover:bg-slate-600 rounded-lg text-sm font-semibold transition">Previous</button>
                <button id="next-btn" onclick="navigate(1)" class="px-5 py-2.5 bg-purple-600 hover:bg-purple-500 rounded-lg text-sm font-semibold transition">Next</button>
                <button id="submit-btn" onclick="submitQuiz()" class="hidden px-6 py-2.5 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 rounded-lg text-sm font-bold transition shadow-lg">Submit Test</button>
            </div>
        </div>

        <!-- Result Screen -->
        <div id="result-screen" class="hidden text-center py-6">
            <div id="result-badge" class="text-6xl mb-4">🎉</div>
            <h2 id="result-title" class="text-2xl sm:text-3xl font-extrabold mb-2"></h2>
            <p id="result-message" class="text-xl font-bold my-4 p-4 rounded-xl"></p>
            
            <div class="bg-slate-900/60 p-6 rounded-xl my-6 border border-slate-700 inline-block w-full max-w-md">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-gray-400">Total Questions:</span>
                    <span id="res-total" class="font-bold text-white">0</span>
                </div>
                <div class="flex justify-between items-center mb-2">
                    <span class="text-gray-400">Correct Answers:</span>
                    <span id="res-correct" class="font-bold text-emerald-400">0</span>
                </div>
                <div class="flex justify-between items-center border-t border-slate-700 pt-2 mt-2">
                    <span class="text-gray-300 font-semibold">Your Score:</span>
                    <span id="res-score" class="font-extrabold text-2xl text-purple-400">0%</span>
                </div>
            </div>

            <button onclick="resetApp()" class="block mx-auto px-8 py-3 bg-purple-600 hover:bg-purple-500 rounded-xl font-bold transition shadow-lg">Try Another Test</button>
        </div>

    </div>

    <script>
        // GENERAL QUESTION BANK (PAPER 1 + PSYCHOLOGY)
        const generalQuestionBank = [
            // Paper 1
            { topic: "Paper 1: Communication", question: "Which barrier occurs due to specialized technical terms or ambiguous language usage?", options: ["Linguistic/Semantic Barrier", "Psychological Barrier", "Physical Barrier", "Environmental Barrier"], answer: 0 },
            { topic: "Paper 1: Communication", question: "In classroom teaching, what element allows the instructor to adjust pace and ensure understanding?", options: ["Feedback", "Encoding", "Channel Noise", "Mass Media"], answer: 0 },
            { topic: "Paper 1: Logical Reasoning", question: "In Indian Logic (Nyaya), which Pramana refers to knowledge gained through comparison and analogy?", options: ["Upamana", "Pratyaksha", "Anumana", "Arthapatti"], answer: 0 },
            { topic: "Paper 1: Logical Reasoning", question: "What represents the invariable relation between the middle term (Hetu) and major term (Sadhya)?", options: ["Vyapti", "Pramana", "Anupalabdhi", "Shabda"], answer: 0 },
            { topic: "Paper 1: ICT", question: "Which national initiative provides digital repository access to millions of e-journals and articles?", options: ["e-ShodhSindhu", "SWAYAM", "DIKSHA", "NPTEL"], answer: 0 },
            // Standard Psychology
            { topic: "Psychology Unit 1", question: "Which Eastern system emphasizes self-knowledge, Vidya vs. Avidya, and the concept of Nishkama Karma?", options: ["Bhagavad Gita", "Behaviorism", "Structuralism", "Logical Empiricism"], answer: 0 },
            { topic: "Psychology Unit 2", question: "Which non-parametric test is the equivalent of the one-way independent ANOVA?", options: ["Kruskal-Wallis test", "Mann-Whitney test", "Wilcoxon Signed Rank test", "Friedman test"], answer: 0 },
            { topic: "Psychology Unit 3", question: "Which attitude measurement scale utilizes bipoles with 7-point rating categories (e.g., Good vs. Bad)?", options: ["Semantic Differential Scale", "Likert Scale", "Guttman Scale", "Stapel Scale"], answer: 0 },
            { topic: "Psychology Unit 4", question: "Which brain structure acts as the relay station for all sensory modalities except olfaction?", options: ["Thalamus", "Hypothalamus", "Amydgala", "Hippocampus"], answer: 0 },
            { topic: "Psychology Unit 5", question: "In Signal Detection Theory, what term describes identifying a signal when no signal was actually present?", options: ["False Alarm", "Hit", "Miss", "Correct Rejection"], answer: 0 },
            { topic: "Psychology Unit 6", question: "Which theory of intelligence proposes the PASS model (Planning, Attention, Simultaneous, Successive)?", options: ["Das, Kar, & Parrila Model", "Gardner Multiple Intelligences", "Cattell Fluid/Crystallized", "Sternberg Triarchic Theory"], answer: 0 },
            { topic: "Psychology Unit 7", question: "Which stress management intervention involves conscious voluntary relaxation of major skeletal muscle groups?", options: ["Progressive Muscle Relaxation (PMR)", "Biofeedback", "Stress Inoculation Training", "Systematic Desensitization"], answer: 0 },
            { topic: "Psychology Unit 8", question: "What phenomenon describes individuals expending less effort when working collectively in a group compared to working individually?", options: ["Social Loafing", "Social Facilitation", "Groupthink", "Deindividuation"], answer: 0 },
            { topic: "Psychology Unit 9", question: "Gerard Egan’s 'Skilled Helper' model of counseling consists of how many primary stages?", options: ["3 Stages (Current, Preferred, Action)", "5 Stages (Intake to Termination)", "2 Stages (Diagnosis and Therapy)", "4 Stages (Assessment, Goal, Action, Evaluation)"], answer: 0 },
            { topic: "Psychology Unit 10", question: "Which term refers to psychological growth and positive transformation experienced following trauma?", options: ["Post-Traumatic Growth", "Eudaimonic Well-being", "Resilience", "Hedonic Treadmill"], answer: 0 }
        ];

        // EXTREME DIFFICULTY PSYCHOLOGY QUESTION BANK (UNITS 1 - 10)
        const toughPsychologyBank = [
            { topic: "Psychology Unit 1: Emergence & Paradigms", question: "According to Wilhelm Dilthey's critique of the strict experimental-analytical paradigm (logical empiricism), what fundamental approach should human sciences (Geisteswissenschaften) adopt over causal explanation (Erklären)?", options: ["Verstehen (Empathetic Understanding)", "Reductive Positivism", "Nomothetic Verification", "Behavioral Operant Conditioning"], answer: 0 },
            { topic: "Psychology Unit 1: Indian Psychology Paradigms", question: "In Integral Yoga and Indian Paradigms of Knowledge, how is the ontological transition from Avidya to Vidya primary operationalized?", options: ["Direct inward realization of Self-Knowledge (Atman/Purusha) bypassing intellectual construct", "Empirical external experimentation via sensory verification", "Strict cognitive modification through S-R conditioning", "Statistical reduction of consciousness variables"], answer: 0 },
            { topic: "Psychology Unit 2: Advanced Statistics", question: "In Factor Analysis, when factors are correlated in the real world, which factor rotation method mathematically allows non-orthogonal (correlated) factor axes?", options: ["Direct Oblimin / Promax", "Varimax", "Equamax", "Quartimax"], answer: 0 },
            { topic: "Psychology Unit 2: Research & Experimental Design", question: "When controlling for a continuous nuisance covariate while assessing group differences across multiple categorical independent variables, which statistical technique is mathematically appropriate?", options: ["ANCOVA (Analysis of Covariance)", "MANOVA", "Kruskal-Wallis Test", "Tetrachoric Correlation"], answer: 0 },
            { topic: "Psychology Unit 3: Psychometrics & Testing", question: "Which specific correlation technique is mathematically designed to correlate two variables when one is a continuous variable and the other is a true natural dichotomy (e.g., Male/Female)?", options: ["Point-Biserial Correlation", "Biserial Correlation", "Tetrachoric Correlation", "Phi Coefficient"], answer: 0 },
            { topic: "Psychology Unit 4: Biological Basis & Neurophysiology", question: "During the absolute refractory period of a neuronal action potential, why is it physically impossible for another action potential to be initiated regardless of stimulus strength?", options: ["Voltage-gated Sodium (Na+) channels are completely inactivated", "Potassium (K+) channels are entirely closed", "Hyperpolarization has increased threshold voltage", "Neurotransmitters are completely depleted at the presynaptic terminal"], answer: 0 },
            { topic: "Psychology Unit 5: Perception & Signal Detection", question: "In Signal Detection Theory, if an observer's criterion (beta) becomes extremely conservative, what predictable shifts occur in their response probabilities?", options: ["Hits decrease and False Alarms decrease", "Hits increase and False Alarms increase", "Hits increase and Misses decrease", "False Alarms increase and Correct Rejections decrease"], answer: 0 },
            { topic: "Psychology Unit 5: Learning & Neurophysiology", question: "Which cellular and synaptic phenomenon, involving NMDA receptor activation and calcium influx in the hippocampus, serves as the primary neural mechanism for Long-Term Potentiation (LTP)?", options: ["Retrograde signaling via Nitric Oxide and AMPA receptor insertion", "Inhibition of GABAergic interneurons only", "Degeneration of dendritic spines", "Depletion of presynaptic acetylcholine stores"], answer: 0 },
            { topic: "Psychology Unit 6: Cognitive & Intelligence Models", question: "In J.P. Das's PASS Theory of Intelligence (based on Luria's neuro-psychological model), which brain structure is primarily responsible for Planning and Executive Control?", options: ["Prefrontal Cortex (Frontal Lobe)", "Occipito-Parietal Area", "Temporal Lobe", "Basal Ganglia"], answer: 0 },
            { topic: "Psychology Unit 7: Motivation & Emotion Models", question: "According to Lazarus's Cognitive-Mediational Theory of Emotion, what occurs during 'Secondary Appraisal'?", options: ["Evaluation of personal coping options and resources to handle the stressor", "Assessment of whether the event is positive, irrelevant, or threatening", "Direct physiological autonomic arousal release without cognitive labeling", "Re-evaluation of the initial threat post-behavioral outcome"], answer: 0 },
            { topic: "Psychology Unit 8: Advanced Social Psychology", question: "According to Tajfel & Turner's Social Identity Theory, under what specific social condition is an individual most likely to engage in Social Creativity strategies rather than Individual Mobility?", options: ["When intergroup status boundaries are perceived as stable and impermeable", "When intergroup status boundaries are highly permeable", "When social identity is weak and personal identity is dominant", "When relative deprivation is completely absent"], answer: 0 },
            { topic: "Psychology Unit 9: Psychopathology & Interventions", question: "In Dialectical Behavior Therapy (DBT), what represents the fundamental dialectical tension that the therapist works to synthesize during treatment?", options: ["Radical Acceptance of reality vs. The drive for Change and behavioral transformation", "Unconscious conflict resolution vs. Cognitive restructuring", "Classical conditioning vs. Operant extinction", "Ego defense strengthening vs. Id expression"], answer: 0 },
            { topic: "Psychology Unit 9: Counseling & Psychotherapy", question: "In Albert Ellis's REBT framework, what does the 'D' and 'E' stand for in the expanded ABCDE therapeutic intervention model?", options: ["Disputing irrational beliefs & Effective new philosophy/belief system", "Diagnostic assessment & Evaluative feedback", "Desensitization of phobia & Emotional catharsis", "Differential reinforcement & Extinction protocol"], answer: 0 },
            { topic: "Psychology Unit 10: Health & Psychoneuroimmunology", question: "In Psychoneuroimmunology, sustained chronic activation of the Hypothalamic-Pituitary-Adrenal (HPA) axis suppresses immune functioning primarily through the prolonged secretion of:", options: ["Cortisol (Glucocorticoids)", "Epinephrine", "Acetylcholine", "Melatonin"], answer: 0 },
            { topic: "Psychology Unit 10: Emerging Areas & Well-being", question: "According to Ryff's Model of Psychological Well-being (Eudaimonic perspective), which of the following is NOT one of the six core dimensions?", options: ["Subjective Hedonic Pleasure", "Autonomy", "Environmental Mastery", "Personal Growth"], answer: 0 }
        ];

        let currentQuestions = [];
        let userAnswers = {};
        let currentIndex = 0;
        let timerInterval = null;
        let totalTimeSeconds = 0;
        let selectedDuration = 0;
        let isOnlyPsychologyMode = false;

        function startTest(durationMins, numQuestions, toughPsychOnly = false) {
            selectedDuration = durationMins;
            isOnlyPsychologyMode = toughPsychOnly;
            
            // Choose question pool based on mode
            let sourceBank = toughPsychOnly ? toughPsychologyBank : generalQuestionBank;

            // Shuffle questions and options dynamically
            let shuffled = [...sourceBank].sort(() => 0.5 - Math.random());
            let rawSelected = shuffled.slice(0, Math.min(numQuestions, sourceBank.length));
            
            currentQuestions = rawSelected.map(q => {
                let optionsWithIndex = q.options.map((opt, i) => ({ text: opt, isCorrect: i === q.answer }));
                optionsWithIndex.sort(() => 0.5 - Math.random());
                return {
                    topic: q.topic,
                    question: q.question,
                    options: optionsWithIndex.map(o => o.text),
                    answer: optionsWithIndex.findIndex(o => o.isCorrect)
                };
            });

            userAnswers = {};
            currentIndex = 0;

            totalTimeSeconds = durationMins * 60;
            updateTimerDisplay();
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                totalTimeSeconds--;
                updateTimerDisplay();
                if (totalTimeSeconds <= 0) {
                    clearInterval(timerInterval);
                    submitQuiz();
                }
            }, 1000);

            document.getElementById('selection-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            renderQuestion();
        }

        function updateTimerDisplay() {
            let mins = Math.floor(totalTimeSeconds / 60);
            let secs = totalTimeSeconds % 60;
            document.getElementById('timer').innerText = 
                `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        function renderQuestion() {
            let q = currentQuestions[currentIndex];
            document.getElementById('q-counter').innerText = `${currentIndex + 1} / ${currentQuestions.length}`;
            document.getElementById('q-category').innerText = q.topic;
            document.getElementById('q-text').innerText = q.question;

            let optionsHtml = '';
            q.options.forEach((opt, idx) => {
                let isSelected = userAnswers[currentIndex] === idx;
                optionsHtml += `
                    <button onclick="selectOption(${idx})" class="w-full text-left p-4 rounded-xl border transition-all flex items-center justify-between ${isSelected ? 'bg-purple-600/40 border-purple-400 text-white shadow-lg' : 'bg-slate-800/60 border-slate-700 hover:bg-slate-700/60 text-slate-200'}">
                        <span>${opt}</span>
                        <span class="w-5 h-5 rounded-full border ${isSelected ? 'border-pink-400 bg-pink-500' : 'border-slate-500'} flex items-center justify-center text-xs">
                            ${isSelected ? '✓' : ''}
                        </span>
                    </button>
                `;
            });
            document.getElementById('options-container').innerHTML = optionsHtml;

            document.getElementById('prev-btn').style.visibility = currentIndex === 0 ? 'hidden' : 'visible';
            if (currentIndex === currentQuestions.length - 1) {
                document.getElementById('next-btn').classList.add('hidden');
                document.getElementById('submit-btn').classList.remove('hidden');
            } else {
                document.getElementById('next-btn').classList.remove('hidden');
                document.getElementById('submit-btn').classList.add('hidden');
            }
        }

        function selectOption(optIndex) {
            userAnswers[currentIndex] = optIndex;
            renderQuestion();
        }

        function navigate(dir) {
            currentIndex += dir;
            renderQuestion();
        }

        function submitQuiz() {
            clearInterval(timerInterval);

            let correctCount = 0;
            currentQuestions.forEach((q, idx) => {
                if (userAnswers[idx] === q.answer) {
                    correctCount++;
                }
            });

            let percentage = Math.round((correctCount / currentQuestions.length) * 100);

            // LOG TEST SCORE TO RENDER LOGS
            console.log("==========================================");
            console.log(`📊 NEW TEST COMPLETED BY USER (${isOnlyPsychologyMode ? "ONLY PSYCHOLOGY MODE" : "GENERAL MODE"})`);
            console.log(`⏰ Time: ${new Date().toLocaleString()}`);
            console.log(`⏱️ Duration: ${selectedDuration} Mins`);
            console.log(`📝 Score: ${correctCount}/${currentQuestions.length} (${percentage}%)`);
            console.log(`🎯 Status: ${percentage >= 80 ? 'PASSED (≥80%)' : 'FAILED (<80%)'}`);
            console.log("==========================================");

            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');

            document.getElementById('res-total').innerText = currentQuestions.length;
            document.getElementById('res-correct').innerText = correctCount;
            document.getElementById('res-score').innerText = `${percentage}%`;

            let badge = document.getElementById('result-badge');
            let title = document.getElementById('result-title');
            let msg = document.getElementById('result-message');

            if (percentage >= 80) {
                badge.innerText = '🥳🎉';
                title.innerText = 'CONGRATULATIONS!';
                title.className = 'text-2xl sm:text-3xl font-extrabold text-emerald-400';
                msg.innerText = 'Ab tum ek baat puch sakti ho 🤪';
                msg.className = 'text-xl sm:text-2xl font-bold my-4 p-4 rounded-xl bg-emerald-500/20 text-emerald-300 border border-emerald-500/40';

                confetti({
                    particleCount: 120,
                    spread: 70,
                    origin: { y: 0.6 }
                });
            } else {
                badge.innerText = '🙈📚';
                title.innerText = 'TEST COMPLETED';
                title.className = 'text-2xl sm:text-3xl font-extrabold text-rose-400';
                msg.innerText = 'Gadhedi padhai kar';
                msg.className = 'text-xl sm:text-2xl font-bold my-4 p-4 rounded-xl bg-rose-500/20 text-rose-300 border border-rose-500/40';
            }
        }

        function resetApp() {
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('selection-screen').classList.remove('hidden');
        }
    </script>
</body>
</html>
